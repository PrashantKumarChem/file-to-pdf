[pytest]
testpaths = tests
# capture=sys, not the default fd: fd capture swaps the process's stdout and
# stderr handles around each test, which intermittently breaks Tk startup in
# the next GUI test ("couldn't read file .../ttk/spinbox.tcl"). It failed 6 of
# 12 runs of tests/test_gui.py with fd capture and 0 of 12 with sys capture.
addopts = -p no:cacheprovider --capture=sys
markers =
    slow: renders through Chromium or nbconvert (deselect with -m "not slow")
