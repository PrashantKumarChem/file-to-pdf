# Dependabot: which dependencies it keeps up to date, and when.
#
# Version updates come once a quarter (the first day of January, April, July
# and October), and only for releases that have been out for at least 14 days,
# which gives a broken or malicious release time to be pulled first. GitHub's
# own default is 3 days. Each ecosystem's updates arrive in up to three pull
# requests: minor and patch updates together, major updates together, and
# security updates.
#
# Security updates open as soon as GitHub raises an alert. Neither the schedule
# nor the cooldown applies to them.
#
# Dependabot reads this file only from the default branch, so the supply-chain
# workflow checks it on every pull request: against Dependabot's schema
# (check-jsonschema), and for a cooldown of at least the 14 days set in
# .github/zizmor.yml (zizmor). Change that number and the cooldowns together.
#
# The pins are exact, so an update can change how PDFs render: the "visual"
# check compares them, and "app" builds and tests the Windows app.
version: 2
updates:
  # The actions the workflows use, pinned to commits. "/" makes Dependabot
  # look in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    cooldown:
      default-days: 14 # GitHub Actions supports only default-days
    groups:
      actions:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
      # Majors apart, so one that needs work can't hold back the rest.
      actions-major:
        applies-to: version-updates
        update-types: [major]
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  # pyproject.toml, with its dependency groups (dev, packaging, audit), and
  # uv.lock, which each update pull request relocks.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: quarterly
    cooldown:
      default-days: 14
    groups:
      python:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
      # Majors apart, so one that needs work can't hold back the rest.
      python-major:
        applies-to: version-updates
        update-types: [major]
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
