name: Supply chain

# Checks what the app and its builds are made from, on Windows:
# - uv.lock is in step with pyproject.toml;
# - no package in uv.lock (every group) has a known vulnerability (pip-audit);
# - the workflows avoid known-unsafe patterns (zizmor);
# - .github/dependabot.yml matches Dependabot's schema (check-jsonschema).
# On pull requests and pushes to main, weekly because new advisories appear
# without any change here, and on demand. The tools are locked in the
# "audit" dependency group.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --check

      # --frozen, not --locked: the audits still run when the lock check
      # above failed.
      - name: Install the audit tools from uv.lock
        id: tools
        if: ${{ !cancelled() }}
        run: uv sync --frozen --only-group audit

      - name: Export every locked package, with hashes
        id: export
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: uv export --frozen --all-groups --format requirements.txt --output-file "$env:RUNNER_TEMP\locked-requirements.txt"

      # --disable-pip audits exactly the pinned, hashed list instead of
      # resolving it again.
      - name: Audit the locked packages for known vulnerabilities
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        run: uv run --no-sync pip-audit --requirement "$env:RUNNER_TEMP\locked-requirements.txt" --require-hashes --disable-pip --progress-spinner off

      # The token lets zizmor look up the actions the workflows use (pinned
      # commits, known-vulnerable versions); it only reads. dependabot.yml
      # joins the scan when Dependabot gets its cooldown (plan, Phase 3).
      - name: Audit the workflows with zizmor
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync zizmor --format github .github/workflows

      # Dependabot reads its configuration only from the default branch, so a
      # mistake would otherwise show only after merging. The schema is the
      # copy of SchemaStore's bundled in check-jsonschema: no download, and it
      # rejects unknown keys and values such as an unsupported interval.
      - name: Check dependabot.yml against its schema
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: uv run --no-sync check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml
