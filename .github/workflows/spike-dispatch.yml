name: Spike dispatch

# Throwaway (never merged). Round 1 showed that a commit made with
# GITHUB_TOKEN starts the PR's pull_request runs in "action_required", and a
# dispatched run's checks don't count for the PR. Round 2: can the same
# workflow approve those runs with GITHUB_TOKEN, so the PR's own checks run
# on the new head?

on:
  pull_request:
    types: [synchronize]

permissions: {}

jobs:
  commit-then-approve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Commit a file with GITHUB_TOKEN, then approve the runs it starts
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
        run: |
          old=$(gh api "repos/$REPO/contents/spike-marker.txt?ref=$BRANCH" --jq .sha)
          content=$(date -u +%FT%TZ | base64)
          head=$(gh api -X PUT "repos/$REPO/contents/spike-marker.txt" -f message="Spike round 2: commit made with GITHUB_TOKEN" -f content="$content" -f branch="$BRANCH" -f sha="$old" --jq .commit.sha)
          echo "new head $head"
          for i in $(seq 1 30); do
            ids=$(gh api "repos/$REPO/actions/runs?head_sha=$head" --jq '.workflow_runs[] | select(.conclusion == "action_required") | .id')
            [ -n "$ids" ] && break
            sleep 5
          done
          echo "runs waiting for approval: ${ids:-none}"
          for id in $ids; do
            gh api -X POST "repos/$REPO/actions/runs/$id/approve" && echo "approved $id with GITHUB_TOKEN" || echo "approve $id with GITHUB_TOKEN: refused"
          done
