name: Tests

# Runs the pytest suite on Windows, the platform the app is for, with the
# Python in .python-version and the packages in uv.lock: every pull request,
# every push to main, and on demand.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # No Actions cache: the locked packages download in seconds, and a
          # cache would keep about 110 MB in the repository's storage.
          enable-cache: false

      # uv installs the Python in .python-version itself. --locked fails if
      # uv.lock is out of step with pyproject.toml.
      - name: Install Python and the locked dependencies
        run: uv sync --locked

      - name: Install Chromium's headless shell
        run: uv run --no-sync python -m playwright install --only-shell chromium

      - name: Run the tests
        run: uv run --no-sync python -m pytest
