name: Tests

# Runs the pytest suite on Windows, the platform the app is for, with the
# Python in .python-version and the packages in uv.lock: every pull request,
# every push to main, weekly (a runner image update can break a test that no
# change here would), and on demand.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1" # Mondays, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Also the parent commits: in a pull request's merge commit the
          # first parent is the base branch, which the coverage floor check
          # compares with.
          fetch-depth: 2
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # uv installs the Python in .python-version itself. --locked fails if
      # uv.lock is out of step with pyproject.toml.
      - name: Install Python and the locked dependencies
        run: uv sync --locked

      - name: Report the Python and Tk versions
        run: uv run --no-sync python -c "import sys, tkinter; print('Python', sys.version, 'at', sys.base_prefix); print('Tk', tkinter.Tcl().eval('info patchlevel'))"

      - name: Install Chromium's headless shell
        run: uv run --no-sync python -m playwright install --only-shell chromium

      - name: Run the tests, measuring coverage
        run: uv run --no-sync coverage run -m pytest

      # The table goes into the job summary; the second report's exit code
      # is the step's, and it fails when the total is below the floor.
      - name: Check coverage against the floor in pyproject.toml
        shell: pwsh
        run: |
          uv run --no-sync coverage report --format=markdown >> $env:GITHUB_STEP_SUMMARY
          uv run --no-sync coverage report

      - name: Check that the coverage floor wasn't lowered
        if: ${{ !cancelled() }}
        run: uv run --no-sync python ci/coverage_floor.py HEAD^1
