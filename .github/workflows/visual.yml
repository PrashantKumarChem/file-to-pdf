name: Visual comparison

# Renders the files in tests/visual/corpus on Windows and compares the PDFs
# with tests/visual/fingerprints.json (see ci/visual.py). When a file differs,
# the job fails, renders the base branch's code too so the report can say
# what caused the difference, and uploads the "visual-comparison" artifact:
# before, after and difference images of the differing pages, both
# renderings' PDFs, and the new fingerprints. If the new rendering is right,
# run "Accept new rendering" (accept-rendering.yml) for the pull request.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The parent commit too: in a pull request's merge commit the first
          # parent is the base branch, rendered for comparison.
          fetch-depth: 2
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install Python and the locked dependencies
        run: uv sync --locked

      - name: Install Chromium's headless shell
        run: uv run --no-sync python -m playwright install --only-shell chromium

      - name: Render the corpus
        run: uv run --no-sync python ci/visual.py render tests/visual/corpus "$env:RUNNER_TEMP\visual\after"

      - name: Fingerprint the PDFs
        run: uv run --no-sync python ci/visual.py fingerprint "$env:RUNNER_TEMP\visual\after" "$env:RUNNER_TEMP\visual\fingerprints.json"

      - name: Compare with the stored fingerprints
        id: compare
        run: >
          uv run --no-sync python ci/visual.py compare tests/visual/fingerprints.json
          "$env:RUNNER_TEMP\visual\fingerprints.json"
          --failed "$env:RUNNER_TEMP\visual\after\failed-requests.json"
          --summary "$env:GITHUB_STEP_SUMMARY"

      # Everything below runs only when the comparison found a difference.

      - name: Check out the base branch
        id: base-checkout
        if: failure() && steps.compare.outcome == 'failure'
        continue-on-error: true
        run: git worktree add "$env:RUNNER_TEMP\base" HEAD^1

      - name: Install the base branch's locked dependencies and Chromium
        id: base-install
        if: failure() && steps.base-checkout.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ runner.temp }}/base
        run: |
          uv sync --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync python -m playwright install --only-shell chromium

      # This script, with the base branch's topdf and packages.
      - name: Render the corpus with the base branch
        id: base-render
        if: failure() && steps.base-install.outcome == 'success'
        continue-on-error: true
        run: >
          uv run --no-sync --project "$env:RUNNER_TEMP\base" python ci/visual.py render tests/visual/corpus
          "$env:RUNNER_TEMP\visual\before" --code "$env:RUNNER_TEMP\base"

      - name: Fingerprint the base branch's PDFs
        id: base-fingerprint
        if: failure() && steps.base-render.outcome == 'success'
        continue-on-error: true
        run: uv run --no-sync python ci/visual.py fingerprint "$env:RUNNER_TEMP\visual\before" "$env:RUNNER_TEMP\visual\before.json"

      - name: Report what differs and why
        if: failure() && steps.compare.outcome == 'failure'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          $before = @()
          if (Test-Path "$env:RUNNER_TEMP\visual\before.json") { $before = @("--before", "$env:RUNNER_TEMP\visual\before.json") }
          "(The table above was made before the base branch was rendered; this one says what caused each difference.)" >> $env:GITHUB_STEP_SUMMARY
          uv run --no-sync python ci/visual.py compare tests/visual/fingerprints.json "$env:RUNNER_TEMP\visual\fingerprints.json" @before --failed "$env:RUNNER_TEMP\visual\after\failed-requests.json" --json "$env:RUNNER_TEMP\visual\comparison.json" --summary "$env:GITHUB_STEP_SUMMARY" --pr "$env:PR"
          exit 0

      - name: Draw the differing pages
        if: failure() && steps.compare.outcome == 'failure'
        run: uv run --no-sync python ci/visual.py images "$env:RUNNER_TEMP\visual\before" "$env:RUNNER_TEMP\visual\after" "$env:RUNNER_TEMP\visual\comparison.json" "$env:RUNNER_TEMP\visual\images"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.compare.outcome == 'failure'
        with:
          name: visual-comparison
          path: ${{ runner.temp }}/visual
          retention-days: 30
