name: Windows app

# Builds the standalone Windows app (packaging/topdf.spec) and checks it with
# packaging/smoke_test.py. Pull requests that touch the app's code, its
# dependencies or its packaging build it; pushing a v* tag also attaches the
# zip to a GitHub release. Actions are pinned to commits (Dependabot updates
# them).

on:
  pull_request:
    paths:
      - "topdf/**"
      - "requirements.txt"
      - "packaging/**"
      - ".github/workflows/windows-app.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements.txt

      - name: Check that the tag matches topdf.__version__ and CITATION.cff
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = python -c "import topdf; print(topdf.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "tag ${{ github.ref_name }} does not match topdf.__version__ $version"
          }
          $cited = (Select-String -Path CITATION.cff -Pattern '^version:\s*(\S+)').Matches.Groups[1].Value
          if ($cited -ne $version) {
            throw "CITATION.cff says version $cited, topdf.__version__ is $version"
          }

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r packaging/requirements.txt

      - name: Install Chromium's headless shell inside the Playwright package
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: python -m playwright install --only-shell chromium

      - name: Build
        run: python -m PyInstaller --noconfirm packaging/topdf.spec

      - name: Smoke test
        run: python packaging/smoke_test.py dist/FileToPDF

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/FileToPDF -DestinationPath FileToPDF-windows.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FileToPDF-windows
          path: FileToPDF-windows.zip
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: FileToPDF-windows

      # Lets anyone check the zip came from this workflow:
      #     gh attestation verify FileToPDF-windows.zip -R PrashantKumarChem/file-to-pdf
      # GitHub only offers attestations for public repositories on this plan,
      # so the step runs only when the event says the repository is public
      # (and is skipped, not failed, if it doesn't say).
      - name: Attest the zip's build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: FileToPDF-windows.zip

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" FileToPDF-windows.zip
          --repo "${{ github.repository }}" --title "File to PDF ${GITHUB_REF_NAME#v}" --generate-notes
