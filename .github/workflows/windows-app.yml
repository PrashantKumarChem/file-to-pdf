name: Windows app

# Builds the standalone Windows app (packaging/file_to_pdf.spec) and checks
# it with packaging/smoke_test.py. Pull requests that touch packaging build
# it; pushing a v* tag also attaches the zip to a GitHub release.

on:
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/windows-app.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r packaging/requirements.txt

      - name: Install Chromium's headless shell inside the Playwright package
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: python -m playwright install --only-shell chromium

      - name: Build
        run: python -m PyInstaller --noconfirm packaging/file_to_pdf.spec

      - name: Smoke test
        run: python packaging/smoke_test.py dist/FileToPDF

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/FileToPDF -DestinationPath FileToPDF-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FileToPDF-windows
          path: FileToPDF-windows.zip
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FileToPDF-windows

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" FileToPDF-windows.zip
          --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
