name: Windows app

# Builds the standalone Windows app (packaging/topdf.spec) once, checks the
# build with packaging/smoke_test.py, and tests the zip itself end to end
# (packaging/e2e): unzipped into a fresh folder, topdf.exe on every file type
# and the window driven by script, on Windows Server 2022 and 2025 for tags
# and manual runs, and on Server 2025 for pull requests. The build job also
# writes the zip's software bill of materials (ci/sbom.py) and SHA256SUMS
# (ci/checksums.py),
# and every later job checks what it downloaded against those checksums and
# the build job's own record of the zip's hash, so nothing is rebuilt or
# swapped after testing. Pull requests build it when they touch the app's
# code, its dependencies, its packaging or this workflow; the "app" job always
# reports, so it can be a required check. Pushing a v* tag also releases the
# zip, its bill of materials and SHA256SUMS once every end-to-end leg passes:
# as a draft first, whose files are checked again, then published. Actions are pinned to commits (Dependabot updates
# them).

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # In a pull request's merge commit the first parent is the base
          # branch, so HEAD^1..HEAD is what the pull request changes.
          fetch-depth: 2
          persist-credentials: false

      - name: Does this change touch the app?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "Not a pull request: build and test the app."
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD | tee changed.txt
          if grep -qE '^(topdf/|packaging/|pyproject\.toml$|uv\.lock$|\.python-version$|\.github/workflows/windows-app\.yml$|ci/(sbom|checksums)\.py$)' changed.txt; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the app is built from changed."
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    # A named image rather than windows-latest, so the build doesn't move to a
    # new Windows unannounced; the e2e job tests the zip on every image.
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      zip_sha256: ${{ steps.hash.outputs.zip_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A fixed uv: its CycloneDX export is a preview whose format may change
      # between releases. Caches downloads except on tag pushes, so a release
      # builds from nothing but the lock.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"

      # The Python in .python-version, the app's locked dependencies and the
      # packaging group; not the test tools.
      - name: Install Python and the locked dependencies
        run: uv sync --locked --no-dev --group packaging

      # The manifest, pyproject.toml, topdf/__init__.py, CITATION.cff and
      # uv.lock must all say the tag's version. The tag name reaches the
      # script as an environment variable, never pasted into its text.
      - name: Check that the tag matches every version file
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: uv run --no-sync python ci/versions.py --tag "$env:TAG"

      - name: Install Chromium's headless shell inside the Playwright package
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: uv run --no-sync python -m playwright install --only-shell chromium

      - name: Build
        run: uv run --no-sync python -m PyInstaller --noconfirm packaging/topdf.spec

      - name: Smoke test
        run: uv run --no-sync python packaging/smoke_test.py dist/FileToPDF

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/FileToPDF -DestinationPath FileToPDF-windows.zip

      # uv.lock's packages for the app, with PyPI's hashes.
      - name: Export the app's locked packages as CycloneDX
        run: uv export --frozen --no-dev --format cyclonedx1.5 --preview-features sbom-export --output-file "$env:RUNNER_TEMP\lock.cdx.json"

      # Kept to the packages installed in this environment, plus CPython with
      # Tcl/Tk, PyInstaller's bootloader and Chromium's headless shell.
      - name: Write the software bill of materials
        run: uv run --no-sync python ci/sbom.py "$env:RUNNER_TEMP\lock.cdx.json" FileToPDF-windows.cdx.json

      - name: Write SHA256SUMS
        run: uv run --no-sync python ci/checksums.py write SHA256SUMS FileToPDF-windows.zip FileToPDF-windows.cdx.json

      # Hashed a second way, apart from ci/checksums.py; the later jobs check
      # their download against this output as well as against SHA256SUMS.
      - name: Record the zip's SHA-256 for the later jobs
        id: hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath FileToPDF-windows.zip).Hash.ToLowerInvariant()
          "zip_sha256=$hash" >> $env:GITHUB_OUTPUT
          "FileToPDF-windows.zip SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FileToPDF-windows
          path: |
            FileToPDF-windows.zip
            FileToPDF-windows.cdx.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  # The one zip, tested on each Windows Server runner for tags and manual runs
  # (a release and its rehearsal), and on the newest for pull requests, which
  # keeps their Windows minutes down.
  e2e:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-2025"]' || '["windows-2022", "windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the Windows version
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          "$($os.Caption), version $($os.Version), runner image $env:ImageOS $env:ImageVersion"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # The test tools (pytest, PyMuPDF, pywinauto). The app under test is
      # the zip, which brings its own Python and Chromium.
      - name: Install the test tools
        run: uv sync --locked

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: FileToPDF-windows
          path: ${{ runner.temp }}/zip

      # The zip under test must be the one the build job hashed.
      - name: Check the download against the build's checksums
        env:
          ZIP_SHA256: ${{ needs.build.outputs.zip_sha256 }}
        run: uv run --no-sync python ci/checksums.py check "$env:RUNNER_TEMP\zip\SHA256SUMS" "FileToPDF-windows.zip=$env:ZIP_SHA256"

      - name: Unzip the app into a fresh folder
        shell: pwsh
        run: Expand-Archive -Path "$env:RUNNER_TEMP\zip\FileToPDF-windows.zip" -DestinationPath "$env:RUNNER_TEMP\fresh"

      # A short temporary folder, so the long-path tests can build paths of
      # exact lengths; it is uploaded when a test fails.
      - name: Test the unzipped app end to end
        env:
          PYTHONIOENCODING: utf-8
        run: >
          uv run --no-sync python -m pytest packaging/e2e -v
          --app "$env:RUNNER_TEMP\fresh\FileToPDF" --basetemp "$env:RUNNER_TEMP\e2e"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-failure-${{ matrix.os }}
          path: ${{ runner.temp }}/e2e
          retention-days: 14

  # The check to require: passes when the app was built and passed its
  # end-to-end tests, or when nothing it is built from changed.
  app:
    needs: [changes, build, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide
        env:
          CHANGES: ${{ needs.changes.result }}
          APP: ${{ needs.changes.outputs.app }}
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "changes: $CHANGES (app touched: $APP), build: $BUILD, end-to-end: $E2E"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Couldn't tell whether this change touches the app."
            exit 1
          fi
          if [ "$APP" = "false" ]; then
            echo "Nothing the app is built from changed; no build needed."
            exit 0
          fi
          if [ "$BUILD" = "success" ] && [ "$E2E" = "success" ]; then
            exit 0
          fi
          echo "::error::The app build ($BUILD) or its end-to-end tests ($E2E) didn't pass."
          exit 1

  # A tag's release: a draft with the files the e2e legs tested, those files
  # checked again as GitHub stores them, and only then published. A version of
  # numbers and dots only (0.3.0) is marked Latest; any other (0.0.0.dev1,
  # 1.0.0rc1) is published as a prerelease and never marked Latest. The notes
  # are the version's section of CHANGELOG.md, which the Release PR writes.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create, upload to and publish the release
      id-token: write # sign the attestation (public repository only)
      attestations: write # store the attestation (public repository only)
    env:
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      ZIP_SHA256: ${{ needs.build.outputs.zip_sha256 }}
    steps:
      # ci/checksums.py, ci/release_notes.py and CHANGELOG.md, at the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: FileToPDF-windows
          path: ${{ runner.temp }}/built

      # The files to publish must be the ones the build job hashed and the
      # e2e job tested: GNU sha256sum checks SHA256SUMS, and ci/checksums.py
      # checks it again with the zip's hash from the build job's output.
      - name: Check the download against the build's checksums
        working-directory: ${{ runner.temp }}/built
        run: |
          sha256sum --check --strict SHA256SUMS
          python3 "$GITHUB_WORKSPACE/ci/checksums.py" check SHA256SUMS "FileToPDF-windows.zip=$ZIP_SHA256"

      - name: Write the release notes from CHANGELOG.md
        id: notes
        run: |
          python3 ci/release_notes.py "$TAG" CHANGELOG.md "$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/notes.md"

      # A re-run finds the draft an earlier attempt left and replaces its files
      # and notes; a published release, or more than one, stops the job.
      - name: Upload the release as a draft
        working-directory: ${{ runner.temp }}/built
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
        run: |
          set -euo pipefail
          files=(FileToPDF-windows.zip FileToPDF-windows.cdx.json SHA256SUMS)
          prerelease="--prerelease=$PRERELEASE"
          existing=$(gh api "repos/$REPO/releases?per_page=100" --paginate \
            --jq '.[] | select(.tag_name == env.TAG) | if .draft then "draft" else "published" end' | paste -sd ' ' -)
          case "$existing" in
            "")
              gh release create "$TAG" "${files[@]}" --repo "$REPO" --draft --verify-tag \
                --title "File to PDF ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" "$prerelease"
              ;;
            draft)
              echo "A draft release of $TAG is left from an earlier attempt: replacing its files and notes."
              gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber
              gh release edit "$TAG" --repo "$REPO" \
                --title "File to PDF ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" "$prerelease"
              ;;
            *)
              echo "::error::$TAG already has these releases: $existing. Only a single draft is replaced."
              exit 1
              ;;
          esac

      # The draft's files as GitHub stores them, before anyone else can see
      # them: exactly the three files, with the build's checksums.
      - name: Check the draft's files against the build's checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '[.assets[].name] | sort | join(" ")')
          if [ "$assets" != "FileToPDF-windows.cdx.json FileToPDF-windows.zip SHA256SUMS" ]; then
            echo "::error::The draft release of $TAG has the files: $assets."
            exit 1
          fi
          gh release download "$TAG" --repo "$REPO" --dir "$RUNNER_TEMP/draft"
          cd "$RUNNER_TEMP/draft"
          sha256sum --check --strict SHA256SUMS
          python3 "$GITHUB_WORKSPACE/ci/checksums.py" check SHA256SUMS "FileToPDF-windows.zip=$ZIP_SHA256"

      # Lets anyone check the zip came from this workflow:
      #     gh attestation verify FileToPDF-windows.zip -R PrashantKumarChem/file-to-pdf
      # GitHub only offers attestations for public repositories on this plan,
      # so the step runs only when the event says the repository is public
      # (and is skipped, not failed, if it doesn't say).
      - name: Attest the zip's build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/draft/FileToPDF-windows.zip

      # Publishing a draft marks it Latest unless told otherwise, so both
      # cases say which they want, and the result is read back.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease=false --latest
          fi
          state=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '"draft=\(.draft) prerelease=\(.prerelease)"')
          latest=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')
          echo "$TAG: $state. Latest: $latest."
          if [ "$state" != "draft=false prerelease=$PRERELEASE" ]; then
            echo "::error::$TAG is $state after publishing."
            exit 1
          fi
          if [ "$PRERELEASE" = "true" ] && [ "$latest" = "$TAG" ]; then
            echo "::error::The prerelease $TAG is marked Latest."
            exit 1
          fi
          if [ "$PRERELEASE" = "false" ] && [ "$latest" != "$TAG" ]; then
            echo "::error::$TAG isn't marked Latest; $latest is."
            exit 1
          fi
          echo "Published $TAG ($state). Latest: $latest." >> "$GITHUB_STEP_SUMMARY"
