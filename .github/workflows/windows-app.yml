name: Windows app

# Builds the standalone Windows app (packaging/topdf.spec) and checks it with
# packaging/smoke_test.py. Pull requests that touch the app's code, its
# dependencies or its packaging build it; pushing a v* tag also attaches the
# zip to a GitHub release. Actions are pinned to commits (Dependabot updates
# them).

on:
  pull_request:
    paths:
      - "topdf/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "packaging/**"
      - ".github/workflows/windows-app.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Caches downloads except on tag pushes, so a release builds from
      # nothing but the lock.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # The Python in .python-version, the app's locked dependencies and the
      # packaging group; not the test tools.
      - name: Install Python and the locked dependencies
        run: uv sync --locked --no-dev --group packaging

      # The tag name reaches the script as an environment variable, never
      # pasted into its text.
      - name: Check that the tag matches topdf.__version__, pyproject.toml and CITATION.cff
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = uv run --no-sync python -c "import topdf; print(topdf.__version__)"
          if ("v$version" -ne $env:TAG) {
            throw "tag $env:TAG does not match topdf.__version__ $version"
          }
          $project = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          if ($project -ne $version) {
            throw "pyproject.toml says version $project, topdf.__version__ is $version"
          }
          $cited = (Select-String -Path CITATION.cff -Pattern '^version:\s*(\S+)').Matches.Groups[1].Value
          if ($cited -ne $version) {
            throw "CITATION.cff says version $cited, topdf.__version__ is $version"
          }

      - name: Install Chromium's headless shell inside the Playwright package
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: uv run --no-sync python -m playwright install --only-shell chromium

      - name: Build
        run: uv run --no-sync python -m PyInstaller --noconfirm packaging/topdf.spec

      - name: Smoke test
        run: uv run --no-sync python packaging/smoke_test.py dist/FileToPDF

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/FileToPDF -DestinationPath FileToPDF-windows.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FileToPDF-windows
          path: FileToPDF-windows.zip
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the zip
      id-token: write # sign the attestation (public repository only)
      attestations: write # store the attestation (public repository only)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: FileToPDF-windows

      # Lets anyone check the zip came from this workflow:
      #     gh attestation verify FileToPDF-windows.zip -R PrashantKumarChem/file-to-pdf
      # GitHub only offers attestations for public repositories on this plan,
      # so the step runs only when the event says the repository is public
      # (and is skipped, not failed, if it doesn't say).
      - name: Attest the zip's build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: FileToPDF-windows.zip

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: >
          gh release create "$TAG" FileToPDF-windows.zip
          --repo "$REPO" --title "File to PDF ${TAG#v}" --generate-notes
