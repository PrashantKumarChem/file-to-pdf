name: Pull request title

# release-please decides the next version and writes the changelog from the
# conventional commit messages on main. A pull request's merge commit carries
# its title as the body, so the title must be one ("fix: ...", "feat: ...").
# This checks the title, and that no commit on the branch starts a paragraph
# with a type that makes a release, which release-please would read as a
# second change (ci/pr_title.py). The "pr-title" check runs again when the
# title or the base branch is edited, not only when commits are pushed.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All history, so the branch's commits can be listed from the base.
          fetch-depth: 0
          persist-credentials: false

      # The title reaches the script as an environment variable, never pasted
      # into its text. The script needs only Python's standard library.
      - name: Check the title and the branch's commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 ci/pr_title.py "$BASE" "$HEAD"
