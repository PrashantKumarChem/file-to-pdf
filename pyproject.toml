[project]
name = "file-to-pdf"
version = "0.2.0"
description = "Convert Jupyter notebooks, JSON, Markdown, code and text files to PDF, 1:1."
requires-python = ">=3.14"
# What the app runs on. uv.lock pins these and everything they pull in, with
# checksums; Dependabot proposes updates.
dependencies = [
    "customtkinter==6.0.0",
    "tkinterdnd2==0.6.3",
    "Pygments==2.21.0",
    "Markdown==3.10.3",
    "playwright==1.62.0",
    "nbconvert==7.17.1",
    "ipython==9.17.1",
]

[dependency-groups]
# Installed by "uv sync" by default: the tests, and the style and type checks
# (uv run ruff check, uv run ruff format --check, uv run pyright).
dev = [
    "pytest==9.1.1",
    "coverage==7.16.1",
    "PyMuPDF==1.28.2",
    "psutil==7.2.2",
    "ruff==0.16.7",
    # The nodejs extra brings Node.js as a locked wheel instead of fetching it
    # when Pyright first runs.
    "pyright[nodejs]==1.1.414",
    # Drives the packaged app's window in packaging/e2e.
    "pywinauto==0.6.9",
]
# Builds the Windows app: uv sync --group packaging
packaging = [
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.7",
]
# Supply-chain checks (.github/workflows/supply-chain.yml): uv sync --group audit
audit = [
    "pip-audit==2.10.1",
    "zizmor==1.30.1",
]

[tool.uv]
# topdf runs from the repository folder (python -m topdf); it isn't built or
# installed as a package.
package = false
# Always uv's own Python builds, never one that happens to be installed, so
# every machine and CI runner gets the same Python and Tk.
python-preference = "only-managed"

[tool.ruff]
# The longest line before Ruff was added was 116 characters.
line-length = 120
# Test input printed exactly as it is, not code of this project.
extend-exclude = ["tests/visual/corpus"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # Pyflakes: unused imports and names, undefined names
    "I",        # import order
    "B",        # likely bugs (flake8-bugbear)
    "UP",       # syntax older than Python 3.14 needs
    "SIM",      # needlessly complicated code
    "BLE",      # bare "except Exception" without a reason given
    "RUF",      # Ruff's own checks
]

[tool.pyright]
include = ["topdf", "tests", "packaging", "ci"]
exclude = ["tests/visual/corpus", "**/__pycache__"]
pythonVersion = "3.14"
pythonPlatform = "Windows"
venvPath = "."
venv = ".venv"

[tool.coverage.run]
source = ["topdf"]
branch = true

[tool.coverage.report]
precision = 1
show_missing = true
# The floor: "coverage report" fails below it. It may only rise, which
# ci/coverage_floor.py checks against the base branch; raise it when tests
# add coverage. Set at 91 when the Windows runner and a local run both
# measured 91.4%, leaving room for thread timing in the GUI tests.
fail_under = 91
